name: Lumaflow CI & Cross-Compilation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------
  # Job 1: TypeScript & React Native Automated Test Suites
  # ----------------------------------------------------
  test-node:
    name: React Native & Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Test Suite (39+ tests)
        run: npm test

  # ----------------------------------------------------
  # Job 2: Rust Core Engine Unit & Benchmark Tests
  # ----------------------------------------------------
  test-rust:
    name: Rust Core Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-core/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust-core/Cargo.lock') }}

      - name: Run Rust Test Suite (Release Mode)
        working-directory: ./rust-core
        run: cargo test --release --workspace

  # ----------------------------------------------------
  # Job 3: Android Cross-Compilation (arm64-v8a, armeabi-v7a, x86_64)
  # ----------------------------------------------------
  build-android:
    name: Android Cross-Compilation (.so)
    runs-on: ubuntu-latest
    needs: [test-rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Android Shared Libraries (.so)
        working-directory: ./rust-core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release --package lumaflow-ffi

      - name: Upload Android Native Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: android/app/src/main/jniLibs/

  # ----------------------------------------------------
  # Job 4: iOS Cross-Compilation (.a & XCFramework)
  # ----------------------------------------------------
  build-ios:
    name: iOS Cross-Compilation (XCFramework)
    runs-on: macos-14
    needs: [test-rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Compile iOS Device & Simulator Binaries
        working-directory: ./rust-core
        run: |
          cargo build --release --target aarch64-apple-ios --package lumaflow-ffi
          cargo build --release --target aarch64-apple-ios-sim --package lumaflow-ffi

      - name: Package XCFramework
        run: |
          mkdir -p ios/Frameworks
          xcodebuild -create-xcframework \
            -library rust-core/target/aarch64-apple-ios/release/liblumaflow_ffi.a \
            -headers rust-core/crates/lumaflow-ffi/include \
            -library rust-core/target/aarch64-apple-ios-sim/release/liblumaflow_ffi.a \
            -headers rust-core/crates/lumaflow-ffi/include \
            -output ios/Frameworks/LumaflowCore.xcframework

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: ios/Frameworks/LumaflowCore.xcframework
